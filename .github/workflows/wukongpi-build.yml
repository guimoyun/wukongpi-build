name: WuKong Pi Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_image:
        description: "同时构建完整可烧录镜像（磁盘需求 ~35GB，建议使用自托管 runner）"
        type: boolean
        default: false

# 上传 Release 资源需要写权限，显式声明避免受仓库默认 read-only 限制
permissions:
  contents: write

concurrency:
  group: wukongpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1) 固件构件：u-boot + 内核 deb
  #    规模随事件变化：发版(tag)/手动触发 -> 三个内核分支全编；
  #    日常提交与 PR -> 只编 current 做快速验证（否则打 tag 时会重复跑一遍）
  # ---------------------------------------------------------------
  artifacts:
    name: ${{ matrix.what }} ${{ matrix.branch || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        what: [uboot, kernel]
        branch: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["legacy","current","edge"]' || '["current"]') }}
        exclude:
          # u-boot 与内核分支无关，只在 current 上构建一次
          - what: uboot
            branch: legacy
          - what: uboot
            branch: edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/share/powershell || true
          sudo apt-get clean || true
          df -h /

      - name: Build ${{ matrix.what }} (${{ matrix.branch }})
        env:
          EXPERT: "yes"
        run: |
          ./compile.sh artifact \
            WHAT=${{ matrix.what }} \
            BOARD=wukongpi \
            BRANCH=${{ matrix.branch }} \
            KERNEL_CONFIGURE=no

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: wukongpi-${{ matrix.what }}-${{ matrix.branch }}
          path: output/debs/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 2) 汇总发布：仅在推送 v* 标签时，把四个 job 的 deb 一次性挂到 Release
  #    （集中在一个 job 里上传，避免多 job 并发创建同一 Release 冲突）
  # ---------------------------------------------------------------
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Collect debs from all matrix jobs
        uses: actions/download-artifact@v4
        with:
          pattern: wukongpi-*
          path: debs
          merge-multiple: true

      - name: List packages
        run: |
          ls -lh debs
          echo "共 $(ls debs/*.deb | wc -l) 个 deb"

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
          generate_release_notes: true

  # ---------------------------------------------------------------
  # 3) 完整镜像：仅手动触发（磁盘/时间开销大）
  # ---------------------------------------------------------------
  image:
    # job name 中 matrix 上下文不可用，故不写变量
    name: full image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_image == 'true'
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/share/powershell || true
          sudo apt-get clean || true
          df -h /

      - name: Build full image
        env:
          EXPERT: "yes"
        run: |
          ./compile.sh build \
            BOARD=wukongpi \
            BRANCH=current \
            RELEASE=${{ matrix.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no

      - name: Compress & upload image
        run: |
          cd output/images
          xz -T0 -9 *.img
          ls -lh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: wukongpi-image-${{ matrix.release }}
          path: output/images/*.img.xz
          if-no-files-found: error

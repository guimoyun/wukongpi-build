name: WuKong Pi Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_image:
        description: "同时构建完整可烧录镜像（磁盘需求 ~35GB，建议使用自托管 runner）"
        type: boolean
        default: false

# 上传 Release 资源需要写权限，显式声明避免受仓库默认 read-only 限制
permissions:
  contents: write

concurrency:
  group: wukongpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1) 固件构件：u-boot + 内核 deb，只做 legacy (6.12) 一个分支
  #    注意 u-boot 包名为 linux-u-boot-${BOARD}-${BRANCH}，必须和内核同分支，
  #    否则后面组装镜像时框架按 BRANCH 找不到对应的 u-boot 包。
  # ---------------------------------------------------------------
  artifacts:
    # 只有发 tag / PR / 手动触发才编译；日常推 main 不再重复跑一遍同样的东西
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    name: ${{ matrix.what }} legacy
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        what: [uboot, kernel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/share/powershell || true
          sudo apt-get clean || true
          df -h /

      - name: Build ${{ matrix.what }} (legacy)
        env:
          EXPERT: "yes"
        run: |
          ./compile.sh artifact \
            WHAT=${{ matrix.what }} \
            BOARD=wukongpi \
            BRANCH=legacy \
            KERNEL_CONFIGURE=no

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: wukongpi-${{ matrix.what }}-legacy
          path: output/debs/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 2) 汇总发布：仅在推送 v* 标签时，把四个 job 的 deb 一次性挂到 Release
  #    （集中在一个 job 里上传，避免多 job 并发创建同一 Release 冲突）
  # ---------------------------------------------------------------
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Collect debs from all matrix jobs
        uses: actions/download-artifact@v4
        with:
          pattern: wukongpi-*
          path: debs
          merge-multiple: true

      - name: List packages
        run: |
          ls -lh debs
          echo "共 $(ls debs/*.deb | wc -l) 个 deb"

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
          generate_release_notes: true

  # ---------------------------------------------------------------
  # 3) 完整镜像：发版(tag)自动构建，也可手动触发
  #    注意：这个 job 在新机器上跑不了虚拟机/qemu 受限环境之外的部分，
  #    GitHub runner 可以挂载 binfmt_misc，所以只有它适合走 whole-image 流程。
  # ---------------------------------------------------------------
  image:
    # job name 中 matrix 上下文不可用，故不写变量
    name: full image
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_image == 'true')
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/share/powershell || true
          sudo apt-get clean || true
          df -h /

      # 组装 armhf rootfs 需要跨架构 chroot：宿主机必须先注册 qemu-arm handler。
      # 否则 armbian 自己的构建容器里 update-binfmts 会失败（Azure 宿主默认没挂载 binfmt_misc）。
      - name: Register QEMU handler on runner host
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      # 复用上面编好的 deb，避免在新机器上重编译内核（省约 1 小时 + 大量磁盘）
      - name: Reuse prebuilt debs
        uses: actions/download-artifact@v4
        with:
          pattern: wukongpi-*
          path: output/debs
          merge-multiple: true

      - name: Show reused packages
        run: |
          mkdir -p output/debs
          ls -lh output/debs

      - name: Build full image
        env:
          EXPERT: "yes"
        run: |
          ./compile.sh build \
            BOARD=wukongpi \
            BRANCH=legacy \
            RELEASE=${{ matrix.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no

      - name: Compress & upload image
        run: |
          cd output/images
          xz -T0 -9 *.img
          ls -lh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: wukongpi-image-${{ matrix.release }}
          path: output/images/*.img.xz
          if-no-files-found: error

      - name: Attach image to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/images/*.img.xz

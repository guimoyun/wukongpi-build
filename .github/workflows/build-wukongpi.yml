name: Build Wukong Pi Armbian

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch"
        required: false
        default: "legacy"
        type: choice
        options:
          - legacy
          - current
          - edge
      release:
        description: "Userspace release"
        required: false
        default: "noble"
        type: choice
        options:
          - bookworm
          - noble
          - trixie
      build_target:
        description: "Build target"
        required: false
        default: "image"
        type: choice
        options:
          - image
          - kernel
          - uboot

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    steps:
      - name: Free disk space
        uses: descriptinc/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Armbian
        run: |
          chmod +x compile.sh
          sudo -E ./compile.sh \
            BOARD=wukongpi \
            BRANCH=${{ github.event.inputs.kernel_branch || 'legacy' }} \
            RELEASE=${{ github.event.inputs.release || 'noble' }} \
            BUILD_MINIMAL=yes \
            BUILD_ONLY=${{ github.event.inputs.build_target || 'image' }} \
            PROGRESS_LOG_TO_FILE=yes \
            USE_TMPFS=no \
            PREFER_DOCKER=no

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-wukongpi-${{ github.event.inputs.kernel_branch || 'legacy' }}
          path: output/images/
          retention-days: 7
